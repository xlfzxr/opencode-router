server:
  addr: "127.0.0.1:3002"
  read_header_timeout: 10s
  shutdown_timeout: 10s

upstream:
  base_url: "https://opencode.ai"
  header_timeout: 30s
  request_timeout: 120s
  stream_idle_timeout: 25s
  catalog_ttl: 10m

session:
  ttl: 2h
  max_entries: 1000

# Local usage statistics and dashboard (http://127.0.0.1:3002/dashboard).
usage:
  enabled: true
  path: ""            # default: ~/.local/state/opencode-router/usage.json
  retention_days: 60  # 0 keeps all history

# Public single-model alias backed by 9router-style smart routing: clients
# configure provider "ocr" with model id "ocr" and the router picks a real
# free-tier model per request (capability auto-switch, rotation, cooldowns,
# fallback down the candidate list on retryable errors).
routing:
  enabled: true
  alias: "ocr"
  strategy: "fallback"   # fallback | round-robin
  sticky_limit: 1        # requests per model before round-robin advances
  auto_switch: true      # float vision/pdf/audio/video-capable models to front
  max_attempts: 3        # max candidate models tried per request (0 = all)
  candidates:            # ordered pool; empty = built-in defaults
    - glm-5.3-flash-free
    - deepseek-v4.1-flash-free
    - minimax-m3.1-flash-free
    - nemotron-3.5-lightning-free
    - mimo-v2.6-flash-free
    - jev-1.13-free
    - nemotron-3.5-super-vl-free
    - flint-40b-free
    - beam-free
    - big-pickle

# Egress proxy, mirroring 9router's proxyAwareFetch options.
# Resolution order: per-request X-OCR-Proxy > connection_proxy_url > url
# > pool (round-robin when enabled) > environment > direct.
proxy:
  enabled: false
  strict: false
  url: ""
  connection_proxy_url: ""
  no_proxy: ""
  use_env: true
  pool_max_transports: 20
  pool:
    - id: tor
      url: "socks5://127.0.0.1:9050"
